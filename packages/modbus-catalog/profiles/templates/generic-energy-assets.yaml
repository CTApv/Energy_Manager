bundle_version: 2.0.0
profiles:
  - id: generic-pv-inverter-v1
    manufacturer: Generic
    family: Renewable Energy
    model: Complete PV Inverter Simulator
    category: pv_inverter
    description: Profilo completo vendor-neutral per collaudo di inverter fotovoltaici. Mappa simulata, non utilizzare su strumenti reali.
    version: 2.0.0
    protocols: [modbus_tcp, modbus_rtu]
    address_base: 0
    defaults: {polling_interval_seconds: 5, unit_id: 1}
    driver: {implementation: standard_modbus, compatibility_group: simulator-pv-v2, register_map: energy-manager-simulator-pv-v2, template: true}
    capabilities: {energy_role: producer, dashboard: photovoltaic, writable: false, strings: 2, phases: 3}
    points:
      - {key: pv.voltage.dc, label: Tensione DC totale, function_code: 3, address: 0, register_count: 2, data_type: float32, unit: V, polling_group: fast, group: Lato DC}
      - {key: pv.current.dc, label: Corrente DC totale, function_code: 3, address: 2, register_count: 2, data_type: float32, unit: A, polling_group: fast, group: Lato DC}
      - {key: pv.power.dc_total, label: Potenza DC, function_code: 3, address: 4, register_count: 2, data_type: float32, unit: kW, polling_group: fast, group: Potenze}
      - {key: pv.power.ac_total, label: Potenza AC prodotta, function_code: 3, address: 6, register_count: 2, data_type: float32, unit: kW, polling_group: fast, group: Potenze}
      - {key: pv.energy.total, label: Energia prodotta totale, function_code: 3, address: 8, register_count: 4, data_type: uint64, scale: 0.01, unit: kWh, polling_group: normal, group: Energie}
      - {key: electrical.frequency, label: Frequenza rete, function_code: 3, address: 12, register_count: 2, data_type: float32, unit: Hz, polling_group: fast, group: Rete AC}
      - {key: pv.inverter.efficiency, label: Rendimento inverter, function_code: 3, address: 14, register_count: 2, data_type: float32, unit: '%', polling_group: normal, group: Prestazioni}
      - {key: pv.inverter.temperature, label: Temperatura inverter, function_code: 3, address: 16, register_count: 2, data_type: float32, unit: °C, polling_group: normal, group: Termica}
      - {key: pv.energy.today, label: Energia prodotta oggi, function_code: 3, address: 18, register_count: 2, data_type: uint32, scale: 0.01, unit: kWh, polling_group: normal, group: Energie}
      - {key: device.operating_state, label: Stato operativo, function_code: 3, address: 20, register_count: 1, data_type: uint16, unit: '', polling_group: fast, group: Stato, enum: {'0': Stand-by, '1': Produzione, '2': Derating, '3': Allarme}}
      - {key: device.alarm_code, label: Codice allarme, function_code: 3, address: 21, register_count: 1, data_type: uint16, unit: '', polling_group: fast, group: Stato}
      - {key: pv.voltage.string1, label: Tensione stringa 1, function_code: 3, address: 22, register_count: 2, data_type: float32, unit: V, polling_group: fast, group: Stringhe}
      - {key: pv.current.string1, label: Corrente stringa 1, function_code: 3, address: 24, register_count: 2, data_type: float32, unit: A, polling_group: fast, group: Stringhe}
      - {key: pv.power.string1, label: Potenza stringa 1, function_code: 3, address: 26, register_count: 2, data_type: float32, unit: kW, polling_group: fast, group: Stringhe}
      - {key: pv.voltage.string2, label: Tensione stringa 2, function_code: 3, address: 28, register_count: 2, data_type: float32, unit: V, polling_group: fast, group: Stringhe}
      - {key: pv.current.string2, label: Corrente stringa 2, function_code: 3, address: 30, register_count: 2, data_type: float32, unit: A, polling_group: fast, group: Stringhe}
      - {key: pv.power.string2, label: Potenza stringa 2, function_code: 3, address: 32, register_count: 2, data_type: float32, unit: kW, polling_group: fast, group: Stringhe}
      - {key: electrical.voltage.l1n, label: Tensione rete L1-N, function_code: 3, address: 34, register_count: 2, data_type: float32, unit: V, polling_group: fast, group: Rete AC}
      - {key: electrical.voltage.l2n, label: Tensione rete L2-N, function_code: 3, address: 36, register_count: 2, data_type: float32, unit: V, polling_group: fast, group: Rete AC}
      - {key: electrical.voltage.l3n, label: Tensione rete L3-N, function_code: 3, address: 38, register_count: 2, data_type: float32, unit: V, polling_group: fast, group: Rete AC}
      - {key: electrical.current.l1, label: Corrente AC L1, function_code: 3, address: 40, register_count: 2, data_type: float32, unit: A, polling_group: fast, group: Rete AC}
      - {key: electrical.current.l2, label: Corrente AC L2, function_code: 3, address: 42, register_count: 2, data_type: float32, unit: A, polling_group: fast, group: Rete AC}
      - {key: electrical.current.l3, label: Corrente AC L3, function_code: 3, address: 44, register_count: 2, data_type: float32, unit: A, polling_group: fast, group: Rete AC}
      - {key: electrical.reactive_power.total, label: Potenza reattiva AC, function_code: 3, address: 46, register_count: 2, data_type: float32, unit: kvar, polling_group: normal, group: Potenze}
      - {key: electrical.apparent_power.total, label: Potenza apparente AC, function_code: 3, address: 48, register_count: 2, data_type: float32, unit: kVA, polling_group: normal, group: Potenze}
      - {key: electrical.power_factor.total, label: Fattore di potenza, function_code: 3, address: 50, register_count: 2, data_type: float32, unit: '', polling_group: normal, group: Rete AC}
      - {key: pv.energy.month, label: Energia prodotta nel mese, function_code: 3, address: 52, register_count: 2, data_type: uint32, scale: 0.01, unit: kWh, polling_group: slow, group: Energie}
      - {key: device.runtime.seconds, label: Tempo di funzionamento, function_code: 3, address: 54, register_count: 2, data_type: uint32, unit: s, polling_group: slow, group: Diagnostica}
      - {key: pv.insulation_resistance, label: Resistenza di isolamento, function_code: 3, address: 56, register_count: 2, data_type: float32, unit: kΩ, polling_group: normal, group: Sicurezza}
      - {key: pv.grid_voltage.average, label: Tensione rete media, function_code: 3, address: 58, register_count: 2, data_type: float32, unit: V, polling_group: normal, group: Rete AC}

  - id: generic-battery-storage-v1
    manufacturer: Generic
    family: BESS
    model: Complete Battery Storage Simulator
    category: battery_storage
    description: Profilo completo vendor-neutral per PCS/BMS; potenza positiva in scarica e negativa in carica.
    version: 2.0.0
    protocols: [modbus_tcp, modbus_rtu]
    address_base: 0
    defaults: {polling_interval_seconds: 5, unit_id: 1}
    driver: {implementation: standard_modbus, compatibility_group: simulator-storage-v2, register_map: energy-manager-simulator-storage-v2, template: true}
    capabilities: {energy_role: bidirectional, dashboard: storage, writable: false}
    points:
      - {key: storage.soc, label: Stato di carica, function_code: 3, address: 100, register_count: 2, data_type: float32, unit: '%', polling_group: fast, group: Batteria}
      - {key: storage.soh, label: Stato di salute, function_code: 3, address: 102, register_count: 2, data_type: float32, unit: '%', polling_group: normal, group: Batteria}
      - {key: storage.power.active, label: Potenza accumulo, function_code: 3, address: 104, register_count: 2, data_type: float32, unit: kW, polling_group: fast, group: Potenze}
      - {key: storage.energy.charge_total, label: Energia caricata totale, function_code: 3, address: 106, register_count: 4, data_type: uint64, scale: 0.01, unit: kWh, polling_group: normal, group: Energie}
      - {key: storage.energy.discharge_total, label: Energia scaricata totale, function_code: 3, address: 110, register_count: 4, data_type: uint64, scale: 0.01, unit: kWh, polling_group: normal, group: Energie}
      - {key: storage.voltage.dc, label: Tensione batteria, function_code: 3, address: 114, register_count: 2, data_type: float32, unit: V, polling_group: fast, group: Lato DC}
      - {key: storage.current.dc, label: Corrente batteria, function_code: 3, address: 116, register_count: 2, data_type: float32, unit: A, polling_group: fast, group: Lato DC}
      - {key: storage.temperature, label: Temperatura media batteria, function_code: 3, address: 118, register_count: 2, data_type: float32, unit: °C, polling_group: normal, group: Termica}
      - {key: storage.cycles, label: Cicli equivalenti, function_code: 3, address: 120, register_count: 2, data_type: uint32, unit: '', polling_group: slow, group: Vita utile}
      - {key: storage.energy.available, label: Energia disponibile, function_code: 3, address: 122, register_count: 2, data_type: float32, unit: kWh, polling_group: normal, group: Energie}
      - {key: device.operating_state, label: Stato PCS/BMS, function_code: 3, address: 124, register_count: 1, data_type: uint16, unit: '', polling_group: fast, group: Stato, enum: {'0': Stand-by, '1': Carica, '2': Scarica, '3': Allarme}}
      - {key: device.alarm_code, label: Codice allarme BMS, function_code: 3, address: 125, register_count: 1, data_type: uint16, unit: '', polling_group: fast, group: Stato}
      - {key: storage.power.reactive, label: Potenza reattiva PCS, function_code: 3, address: 126, register_count: 2, data_type: float32, unit: kvar, polling_group: normal, group: Potenze}
      - {key: storage.power.apparent, label: Potenza apparente PCS, function_code: 3, address: 128, register_count: 2, data_type: float32, unit: kVA, polling_group: normal, group: Potenze}
      - {key: storage.energy.charge_today, label: Energia caricata oggi, function_code: 3, address: 130, register_count: 2, data_type: float32, unit: kWh, polling_group: normal, group: Energie}
      - {key: storage.energy.discharge_today, label: Energia scaricata oggi, function_code: 3, address: 132, register_count: 2, data_type: float32, unit: kWh, polling_group: normal, group: Energie}
      - {key: storage.capacity.usable, label: Capacità utilizzabile, function_code: 3, address: 134, register_count: 2, data_type: float32, unit: kWh, polling_group: slow, group: Batteria}
      - {key: storage.cell_voltage.max, label: Tensione cella massima, function_code: 3, address: 136, register_count: 2, data_type: float32, unit: V, polling_group: normal, group: Celle}
      - {key: storage.cell_voltage.min, label: Tensione cella minima, function_code: 3, address: 138, register_count: 2, data_type: float32, unit: V, polling_group: normal, group: Celle}
      - {key: storage.temperature.max, label: Temperatura massima, function_code: 3, address: 140, register_count: 2, data_type: float32, unit: °C, polling_group: normal, group: Termica}
      - {key: storage.temperature.min, label: Temperatura minima, function_code: 3, address: 142, register_count: 2, data_type: float32, unit: °C, polling_group: normal, group: Termica}
      - {key: storage.power.charge_limit, label: Limite potenza di carica, function_code: 3, address: 144, register_count: 2, data_type: float32, unit: kW, polling_group: normal, group: Limiti}
      - {key: storage.power.discharge_limit, label: Limite potenza di scarica, function_code: 3, address: 146, register_count: 2, data_type: float32, unit: kW, polling_group: normal, group: Limiti}
      - {key: storage.soc.reserve, label: Riserva minima SOC, function_code: 3, address: 148, register_count: 2, data_type: float32, unit: '%', polling_group: slow, group: Limiti}
      - {key: device.runtime.seconds, label: Tempo di funzionamento, function_code: 3, address: 150, register_count: 2, data_type: uint32, unit: s, polling_group: slow, group: Diagnostica}
      - {key: storage.insulation_resistance, label: Resistenza di isolamento, function_code: 3, address: 152, register_count: 2, data_type: float32, unit: kΩ, polling_group: normal, group: Sicurezza}
      - {key: storage.contactor_state, label: Stato contattori, function_code: 3, address: 154, register_count: 1, data_type: uint16, unit: '', polling_group: fast, group: Stato, enum: {'0': Aperti, '1': Chiusi}}
      - {key: storage.control_mode, label: Modalità controllo, function_code: 3, address: 155, register_count: 1, data_type: uint16, unit: '', polling_group: normal, group: Stato, enum: {'0': Automatico, '1': Autoconsumo, '2': Backup}}

