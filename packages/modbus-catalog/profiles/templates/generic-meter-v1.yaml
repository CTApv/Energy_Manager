id: generic-meter-v1
manufacturer: Generic
family: Power Quality Analyzer
model: Complete Three-phase Meter Simulator
category: multimeter
description: Profilo completo vendor-neutral per collaudo di multimetri trifase. Mappa simulata, non utilizzare su strumenti reali.
version: 2.0.0
protocols: [modbus_tcp, modbus_rtu]
address_base: 0
defaults: {polling_interval_seconds: 5, unit_id: 1}
driver: {implementation: standard_modbus, compatibility_group: simulator-meter-v2, register_map: energy-manager-simulator-meter-v2, template: true}
validation: {level: simulated, verified_at: '2026-08-06', verified_by: Energy Manager Digital Twin Lab, evidence: [simulator-register-coverage, ecosystem-energy-balance], notes: Profilo destinato esclusivamente a simulazione e pre-commissioning.}
capabilities: {energy_role: meter, dashboard: power_quality, writable: false, phases: 3}
points:
  - {key: electrical.active_power.total, label: Potenza attiva totale, function_code: 3, address: 100, register_count: 2, data_type: float32, unit: kW, polling_group: fast, group: Potenze}
  - {key: electrical.reactive_power.total, label: Potenza reattiva totale, function_code: 3, address: 102, register_count: 2, data_type: float32, unit: kvar, polling_group: fast, group: Potenze}
  - {key: electrical.apparent_power.total, label: Potenza apparente totale, function_code: 3, address: 104, register_count: 2, data_type: float32, unit: kVA, polling_group: fast, group: Potenze}
  - {key: electrical.power_factor.total, label: Fattore di potenza totale, function_code: 3, address: 106, register_count: 2, data_type: float32, unit: '', polling_group: fast, group: Qualità elettrica}
  - {key: electrical.frequency, label: Frequenza, function_code: 3, address: 108, register_count: 2, data_type: float32, unit: Hz, polling_group: fast, group: Qualità elettrica}
  - {key: electrical.energy.import_total, label: Energia attiva importata, function_code: 3, address: 110, register_count: 2, data_type: uint32, scale: 0.01, unit: kWh, polling_group: normal, group: Energie}
  - {key: electrical.energy.export_total, label: Energia attiva esportata, function_code: 3, address: 112, register_count: 2, data_type: uint32, scale: 0.01, unit: kWh, polling_group: normal, group: Energie}
  - {key: electrical.reactive_energy.import_total, label: Energia reattiva importata, function_code: 3, address: 114, register_count: 2, data_type: uint32, scale: 0.01, unit: kvarh, polling_group: normal, group: Energie}
  - {key: electrical.reactive_energy.export_total, label: Energia reattiva esportata, function_code: 3, address: 116, register_count: 2, data_type: uint32, scale: 0.01, unit: kvarh, polling_group: normal, group: Energie}
  - {key: electrical.apparent_energy.total, label: Energia apparente totale, function_code: 3, address: 118, register_count: 2, data_type: uint32, scale: 0.01, unit: kVAh, polling_group: normal, group: Energie}
  - {key: electrical.voltage.l1n, label: Tensione L1-N, function_code: 3, address: 120, register_count: 2, data_type: float32, unit: V, polling_group: fast, group: Tensioni}
