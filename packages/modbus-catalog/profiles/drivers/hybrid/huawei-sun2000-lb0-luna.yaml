id: huawei-sun2000-lb0-luna
manufacturer: Huawei
family: SUN2000/SUN5000 LB0
model: SUN2000 3–6K-LB0 + LUNA2000
category: pv_inverter
description: Profilo composito read-only per inverter residenziali LB0; include produzione FV, accumulo LUNA e misure del contatore collegato all'inverter.
version: 1.0.0
protocols: [modbus_tcp, modbus_rtu]
address_base: 0
defaults: {polling_interval_seconds: 5, unit_id: 0, tcp_port: 6607}
driver:
  implementation: standard_modbus
  compatibility_group: huawei-sun2000-lb0-luna
  register_map: sun2000lb-v300r024c00
validation: {level: manual_reviewed, verified_at: '2026-08-05', verified_by: Filippo Lolli, evidence: [Huawei SUN2000LB V300R024C00 Issue 04], notes: Collaudo hardware e validazione sul campo ancora da eseguire.}
capabilities:
  energy_role: hybrid
  dashboard: photovoltaic
  components: [photovoltaic, battery_storage, grid_meter]
  writable: false
  communication:
    modbus_tcp: {availability: built_in, note: Porta predefinita 6607 sulla rete locale/VPN secondo il manuale LB0}
    modbus_rtu: {availability: built_in, note: RS485 Modbus RTU; verificare indirizzo logico e firmware minimo}
documentation:
  title: SUN2000LB V300R024C00 Modbus Interface Definitions, Issue 04
  url: https://support.huawei.com/enterprise/en/doc/EDOC1100480329
  verified: '2026-08-05'
  warning: Profilo limitato ai modelli LB0 indicati e firmware V300R024C00 o successivo; non applicare automaticamente a L1/M1/MAP0.
