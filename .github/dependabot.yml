version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: {interval: monthly}
    groups:
      python-runtime: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /apps/web
    schedule: {interval: monthly}
    groups:
      frontend: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
