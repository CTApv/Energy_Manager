name: energy-manager
services:
  simulator:
    build: ./simulators/modbus-simulator
    environment: {SIMULATOR_PROFILE: meter}
    ports: ["5020:5020", "18090:18090"]
    restart: unless-stopped

  simulator-pv:
    build: ./simulators/modbus-simulator
    environment: {SIMULATOR_PROFILE: pv}
    ports: ["5021:5020", "18091:18090"]
    restart: unless-stopped

  simulator-storage:
    build: ./simulators/modbus-simulator
    environment: {SIMULATOR_PROFILE: storage}
    ports: ["5022:5020", "18092:18090"]
    restart: unless-stopped

  simulator-ev:
    build: ./simulators/modbus-simulator
    environment: {SIMULATOR_PROFILE: ev}
    ports: ["5023:5020", "18093:18090"]
    restart: unless-stopped

  simulator-weather:
    build: ./simulators/modbus-simulator
    environment: {SIMULATOR_PROFILE: weather}
    ports: ["5024:5020", "18094:18090"]
    restart: unless-stopped

  edge-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      EM_MODE: edge
      EM_ENVIRONMENT: development
      EM_RELEASE: 0.9.0
      EM_EDGE_ID: ${EM_EDGE_ID:-00000000-0000-4000-8000-000000000001}
      EM_SECRET_KEY: ${EM_SECRET_KEY:-development-only-secret-key-change-me}
      EM_EDGE_DATABASE_URL: sqlite:////data/edge.db
      EM_CONTROL_ROOM_URL: http://control-room-api:8000
      EM_SIMULATOR_HOST: simulator
      EM_EDGE_TOKEN: ${EM_EDGE_TOKEN:-demo-edge-token-change-me}
      EM_DEMO_ADMIN_PASSWORD: ${EM_DEMO_ADMIN_PASSWORD:-EnergyDemo!2026}
      EM_SEED_DEMO: "true"
      EM_BACKUP_DIRECTORY: /data/backups
      EM_CORS_ORIGINS: http://localhost:3000
    volumes: ["edge-data:/data"]
    depends_on: [simulator, simulator-pv, simulator-storage, simulator-ev, simulator-weather]
    ports: ["8000:8000"]
    restart: unless-stopped

  edge-web:
    build:
      context: apps/web
      args: {VITE_APP_MODE: edge, VITE_API_URL: /api}
    environment: {API_UPSTREAM: "edge-api:8000"}
    depends_on: [edge-api]
    ports: ["3000:80"]
    restart: unless-stopped

  control-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energy_manager
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy}
    volumes: ["control-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U energy -d energy_manager"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped

  control-room-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      EM_MODE: control-room
      EM_ENVIRONMENT: development
      EM_RELEASE: 0.9.0
      EM_SECRET_KEY: ${EM_SECRET_KEY:-development-only-secret-key-change-me}
      EM_CONTROL_DATABASE_URL: postgresql+psycopg://energy:${POSTGRES_PASSWORD:-energy}@control-db:5432/energy_manager
      EM_EDGE_TOKEN: ${EM_EDGE_TOKEN:-demo-edge-token-change-me}
      EM_DEMO_ADMIN_PASSWORD: ${EM_DEMO_ADMIN_PASSWORD:-EnergyDemo!2026}
      EM_TAILSCALE_PROVIDER: fake
      EM_WEBHOOK_SECRET: ${EM_WEBHOOK_SECRET:-change-me-webhook}
      EM_CORS_ORIGINS: http://localhost:3001
      EM_CONTROL_RAW_RETENTION_DAYS: ${EM_CONTROL_RAW_RETENTION_DAYS:-30}
      EM_ROLLUP_RETENTION_DAYS: ${EM_ROLLUP_RETENTION_DAYS:-3650}
    depends_on:
      control-db: {condition: service_healthy}
    ports: ["8001:8000"]
    restart: unless-stopped

  control-room-web:
    build:
      context: apps/web
      args: {VITE_APP_MODE: control-room, VITE_API_URL: /api}
    environment: {API_UPSTREAM: "control-room-api:8000"}
    depends_on: [control-room-api]
    ports: ["3001:80"]
    restart: unless-stopped

volumes:
  edge-data:
  control-data:
