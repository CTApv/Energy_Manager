[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-manager-api"
version = "0.8.0"
description = "Energy Manager Edge and Control Room API"
authors = [{ name = "Filippo Lolli", email = "filippoctass@gmail.com" }]
maintainers = [{ name = "Filippo Lolli", email = "filippoctass@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "PyYAML>=6.0,<7",
  "pymodbus>=3.8,<3.12",
  "pyserial>=3.5,<4",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["energy_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
